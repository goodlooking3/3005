name: Local builds

on:
  workflow_dispatch:
  push:
    tags: ['local-*']

jobs:
  android-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Enforce source policies
        run: |
          dart run tool/check_file_lengths.dart
          dart run tool/check_screen_bindings.dart
          dart run tool/check_sqlite_singleton.dart
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test --concurrency=1
      - name: Build local Android 12+ arm64 APK
        run: flutter build apk --release --target-platform android-arm64 --dart-define=WASEL_LOCAL_ONLY=true
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-local-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows-local:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Enforce source policies
        run: |
          dart run tool/check_file_lengths.dart
          dart run tool/check_screen_bindings.dart
          dart run tool/check_sqlite_singleton.dart
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build local Windows bundle
        run: flutter build windows --release --dart-define=WASEL_LOCAL_ONLY=true
      - name: Package Windows bundle
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          $archive = "wasel-windows-local-x64.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Out-File "${archive}.sha256" -Encoding ascii
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\wasel.iss
          $setup = Get-ChildItem windows\installer-output -Filter '*-x64.exe' | Select-Object -First 1
          if (!$setup) { throw "Setup executable was not created" }
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash | Out-File "$($setup.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-local-windows-bundle
          path: |
            wasel-windows-local-x64.zip
            wasel-windows-local-x64.zip.sha256
            windows/installer-output/*
