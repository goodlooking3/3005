name: Local builds

on:
  workflow_dispatch:
  push:
    tags: ['local-*']

jobs:
  android-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - run: flutter pub get
      - name: Enforce source policies
        run: |
          dart run tool/check_file_lengths.dart
          dart run tool/check_screen_bindings.dart
          dart run tool/check_sqlite_singleton.dart
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test --concurrency=1
      - name: Configure ephemeral signing for local APK
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          keytool -genkeypair -v \
            -keystore android/local-build.jks \
            -storepass "$password" \
            -keypass "$password" \
            -alias wasel-local \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Wasel Local Build, OU=Local, O=Wasel, C=YE"
          cat > android/key.properties <<EOF
          storeFile=../local-build.jks
          storePassword=$password
          keyPassword=$password
          keyAlias=wasel-local
          EOF
      - name: Build local Android APK (minSdk 24+, universal)
        run: flutter build apk --release --dart-define=WASEL_LOCAL_ONLY=true
      - name: Preserve universal APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/apk-artifacts/universal
          cp build/app/outputs/flutter-apk/app-release.apk build/apk-artifacts/universal/Wasel-Android-universal-API24.apk
          sha256sum build/apk-artifacts/universal/Wasel-Android-universal-API24.apk | awk '{print $1}' > build/apk-artifacts/universal/Wasel-Android-universal-API24.apk.sha256
      - name: Build local Android APK for ARM32 (armeabi-v7a)
        shell: bash
        run: |
          set -euo pipefail
          rm -f build/app/outputs/flutter-apk/*.apk
          flutter build apk --release --target-platform android-arm --dart-define=WASEL_LOCAL_ONLY=true
          mapfile -t apk_candidates < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apk_candidates[@]}" -ne 1 ]; then
            printf 'Expected exactly one ARM32 APK, found %s\n' "${#apk_candidates[@]}" >&2
            exit 1
          fi
          mkdir -p build/apk-artifacts/arm32
          cp "${apk_candidates[0]}" build/apk-artifacts/arm32/Wasel-Android-arm32-API24.apk
          sha256sum build/apk-artifacts/arm32/Wasel-Android-arm32-API24.apk | awk '{print $1}' > build/apk-artifacts/arm32/Wasel-Android-arm32-API24.apk.sha256
          python3 - <<'PY'
          import zipfile
          apk = 'build/apk-artifacts/arm32/Wasel-Android-arm32-API24.apk'
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
          required = {
              'lib/armeabi-v7a/libapp.so',
              'lib/armeabi-v7a/libflutter.so',
              'lib/armeabi-v7a/libsqlite3.so',
          }
          missing = required - names
          if missing:
              raise SystemExit(f'Missing ARM32 app/Flutter/SQLite libraries: {sorted(missing)}')
          other_abis = [n for n in names if n.startswith(('lib/arm64-v8a/', 'lib/x86_64/'))]
          if other_abis:
              raise SystemExit(f'Unexpected non-ARM32 native libraries: {other_abis[:5]}')
          print('Verified ARM32 app, Flutter engine, and SQLite library; no ARM64/x86_64 libraries included.')
          PY
      - name: Remove ephemeral signing material
        if: always()
        run: rm -f android/key.properties android/local-build.jks
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-local-android-apk
          path: build/apk-artifacts/universal/*
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-local-android-arm32-apk
          path: build/apk-artifacts/arm32/*

  windows-local:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Enforce source policies
        run: |
          dart run tool/check_file_lengths.dart
          dart run tool/check_screen_bindings.dart
          dart run tool/check_sqlite_singleton.dart
      - name: Analyze source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test Windows device fingerprint
        run: flutter test --no-pub --concurrency=1 test/windows_device_id_test.dart
      - name: Build local Windows 10+ x64 bundle
        run: flutter build windows --release --dart-define=WASEL_LOCAL_ONLY=true
      - name: Package Windows bundle
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          $archive = "wasel-windows10-x64-offline-license.zip"
          Compress-Archive -Path "$source\*" -DestinationPath $archive -Force
          (Get-FileHash $archive -Algorithm SHA256).Hash | Out-File "${archive}.sha256" -Encoding ascii
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\wasel.iss
          $setup = Get-ChildItem windows\installer-output -Filter '*-x64.exe' | Select-Object -First 1
          if (!$setup) { throw "Setup executable was not created" }
          (Get-FileHash $setup.FullName -Algorithm SHA256).Hash | Out-File "$($setup.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: wasel-windows10-x64-offline-license
          path: |
            wasel-windows10-x64-offline-license.zip
            wasel-windows10-x64-offline-license.zip.sha256
            windows/installer-output/*
