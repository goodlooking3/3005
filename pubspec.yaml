name: wasel
publish_to: 'none'
description: Wasel — Arabic-first remittance archiving and accounting workspace
version: 0.8.0+8
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  excel: ^4.0.6
  file_picker: ^11.0.3
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  pdf: ^3.11.1
  printing: ^5.13.4
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  http: ^1.2.2
  cryptography: ^2.7.0
  flutter_secure_storage: ^10.0.0
  image: ^4.3.0
  sqflite_common_ffi_web: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.4+4
flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/Amiri-Regular.ttf
          weight: 400
        - asset: assets/Amiri-Bold.ttf
          weight: 700
